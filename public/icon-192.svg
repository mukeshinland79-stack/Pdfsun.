<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0b3d91" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff566" />
      <stop offset="45%" stop-color="#ffc107" />
      <stop offset="90%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2b6e" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff7a00" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Background Frame with Squircle (iOS / Android adaptive) -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Rising Sun Behind PDF Document -->
  <g transform="translate(18, 14)">
    <circle cx="120" cy="50" r="30" fill="url(#sunGrad)" opacity="0.3" filter="url(#glow)" />
    <circle cx="120" cy="50" r="20" fill="url(#sunGrad)" filter="url(#glow)" />
    <!-- Rays -->
    <line x1="120" y1="20" x2="120" y2="10" stroke="#ffc107" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="26" x2="152" y2="19" stroke="#ff7a00" stroke-width="3" stroke-linecap="round" />
    <line x1="150" y1="50" x2="160" y2="50" stroke="#ff7a00" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="74" x2="152" y2="81" stroke="#ffc107" stroke-width="3" stroke-linecap="round" />

    <!-- Main Folded PDF Document -->
    <path d="M 32 20 C 26 20, 22 24, 22 30 L 22 130 C 22 136, 26 140, 32 140 L 110 140 C 116 140, 120 136, 120 130 L 120 58 L 82 20 Z" fill="url(#pdfGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <!-- Fold Corner -->
    <path d="M 82 20 L 120 58 L 90 58 C 85 58, 82 55, 82 50 Z" fill="url(#foldGrad)" />

    <!-- Document Lines -->
    <rect x="38" y="70" width="55" height="7" rx="3.5" fill="#ffffff" opacity="0.95" />
    <rect x="38" y="86" width="68" height="7" rx="3.5" fill="#93c5fd" opacity="0.9" />
    <rect x="38" y="102" width="45" height="7" rx="3.5" fill="#ffc107" opacity="0.95" />

    <!-- AI Sparkle Star -->
    <path d="M 50 36 C 50 42, 56 48, 62 48 C 56 48, 50 54, 50 60 C 50 54, 44 48, 38 48 C 44 48, 50 42, 50 36 Z" fill="#ffffff" />
    <circle cx="50" cy="48" r="2.5" fill="#38bdf8" />
  </g>
</svg>
